# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 公式ドキュメント: https://docs.coderabbit.ai/reference/configuration
# YAML バリデーター: https://docs.coderabbit.ai/configuration/yaml-validator

# -----------------------------------------------------------------------
# 【基本設定】
# -----------------------------------------------------------------------

# レビューコメントの言語を日本語に設定
language: ja

# CodeRabbitの試験的な機能（ベータ機能）を有効にするか
# true にすると新機能をいち早く試せるが、不安定な場合もある
early_access: false

# -----------------------------------------------------------------------
# 【レビュー全体の設定】
# -----------------------------------------------------------------------
reviews:

  # レビューの厳しさ
  #   chill     : 重要な問題のみ指摘。レビュー経験の浅いメンバーが萎縮しないよう、まずはこちら推奨
  #   assertive : より細かい点まで指摘。ある程度慣れてきたら切り替えを検討
  profile: "chill"

  # PR説明欄にコード変更の概要（ハイレベルサマリー）を自動生成するか
  high_level_summary: true

  # ウォークスルーコメントに変更ファイルの一覧を含めるか
  changed_files_summary: true

  # 処理の流れをシーケンス図で可視化するか（複雑なロジックの把握に便利）
  sequence_diagrams: true

  # レビューにかかる工数の目安を表示するか
  estimate_code_review_effort: true

  # PRがリンクされているIssueの要件を満たしているか評価するか
  assess_linked_issues: true

  # ウォークスルーを折りたたんで表示するか（長いレビューが見やすくなる）
  collapse_walkthrough: true

  # レビューのステータス（スキップ理由など）をコメントに表示するか
  review_status: true

  # コミットステータス（pending/success）を GitHub/GitLab 上に表示するか
  commit_status: true

  # -----------------------------------------------------------------------
  # 【自動レビューのトリガー設定】
  # -----------------------------------------------------------------------
  auto_review:

    # 自動レビューを有効にするか
    enabled: true

    # ドラフト PR もレビュー対象にするか
    # false にするとドラフトは無視され、レビュー依頼を出したときだけ動く
    drafts: false

    # レビュー対象のベースブランチ（マージ先）を正規表現で指定
    # ".*" はすべてのブランチが対象
    base_branches:
      - ".*"

  # -----------------------------------------------------------------------
  # 【グローバルレビュー指示】
  # すべてのファイルに共通して適用されるレビュー方針
  # -----------------------------------------------------------------------
  instructions: |
    # レビュー全体の方針

    ## コメントのトーン・言い回し
    - レビュイーが開発経験の浅いメンバーである前提で、丁寧かつわかりやすい言葉でコメントしてください。
    - 問題点を指摘するだけでなく、なぜ問題なのか・どう直せばよいかを具体的なコード例とともに説明してください。
    - 命令形ではなく「〜するとよいでしょう」「〜を検討してみてください」などの柔らかい表現を使ってください。
    - このリポジトリで採用していないアーキテクチャ（例: 新規の Services/Actions 層、API バージョニング、認証基盤の導入）を前提にした改善提案はしないでください。

    ## 指摘しなくてよい項目
    - CSS、Blade テンプレートのデザインスタイル・レイアウト・見た目に関する指摘は不要です。
    - コードフォーマット（インデント幅、スペース、改行など）の細かい指摘は不要です。
      （フォーマットは Laravel Pint / PHP CS Fixer に任せてください）

    ## セキュリティ
    - SQL インジェクション・XSS・CSRF などの脆弱性が疑われる箇所は必ず指摘してください。
    - .env の値や API キー・シークレットがコードに直書きされていないか確認してください。

    ## Laravel のベストプラクティス
    - Eloquent を使う場面で生 SQL が書かれている場合は指摘してください。
    - N+1 クエリ問題（ループ内でクエリが発生するパターン）を検出したら指摘してください。
    - バリデーションは FormRequest を活用することを推奨してください。
    - 例外処理が適切に実装されているか（try-catch、カスタム例外クラスの使用）を確認してください。

  # -----------------------------------------------------------------------
  # 【パス別レビュー指示】
  # ファイルの種類・場所ごとに追加の指示を設定できる
  # -----------------------------------------------------------------------
  path_instructions:

    # --- テスト全般 ---
    - path: "tests/**"
      instructions: |
        テストコードをレビューするときは以下の点を重点的に確認してください。

        【重視する観点（別視点レビュー）】
        - 正常系だけでなく、異常系・境界値・データ不整合時の挙動に見落としがないか確認してください。
        - リファクタリング時に壊れやすい振る舞い（副作用、状態遷移、並び順、重複処理）を検証できているか確認してください。
        - テストが実装詳細に依存しすぎず、仕様・振る舞いを検証できているか確認してください。
        - 不足しているテストがあれば、「どの失敗を防ぐための追加テストか」を添えて提案してください。

    # --- Integration テスト（HTTP/アプリ統合テスト） ---
    - path: "tests/Integration/**"
      instructions: |
        Integration テストでは以下も確認してください。
        - リダイレクト先が想定どおりか（成功時・失敗時で遷移先が変わるケースを含む）を検証しているか。
        - セッションメッセージ（success/error）と文言が、処理結果に応じて正しく設定されるかを検証しているか。
        - DBへの副作用（作成・更新・論理削除）が、成功時のみ発生し、失敗時に発生しないことを検証しているか。
        - UUID の形式不正・未存在・論理削除済みなど、境界ケースで期待どおりの扱いになっているかを検証しているか。
        - バリデーションエラーで返す属性名・メッセージが意図どおりかを検証しているか。
        - 設定値依存のルール（例: 文字数上限）を扱う場合、テスト内で前提設定が明示されているかを確認しているか。

    # --- Browser テスト（E2E） ---
    - path: "tests/Browser/**"
      instructions: |
        Browser テストでは以下も確認してください。
        - 事前に定義したテストケースを自動実行できる構成になっているか（シナリオと手順が追跡可能か）を確認してください。
        - 重要度の高いシナリオ（主要導線、登録/更新/削除、権限によるアクセス可否など）を優先してカバーできているかを確認してください。
        - テストケースの漏れがある場合は、業務影響やユーザー影響が大きい観点から不足シナリオを指摘してください。
        - 各入力項目のバリデーションは代表的なパターンで導線確認できていればよく、全パターン網羅を前提に指摘しないでください。
        - デザイン・文言の完全一致・HTML/CSS構造・詳細なビジネスロジック分岐の網羅は Browser テストの指摘対象外としてください。

    # --- Unit テスト ---
    - path: "tests/Unit/**"
      instructions: |
        Unit テストでは以下も確認してください。
        - 1 つのテストメソッドで 1 つのことだけを検証しているか（単一責任）。
        - 外部依存（DB・API など）はモックに置き換えられているか。

    # --- コントローラ ---
    - path: "app/Http/Controllers/**"
      instructions: |
        コントローラのレビューでは以下を確認してください。
        - ビジネスロジックがコントローラに書かれていないか（薄いコントローラを推奨）。
        - バリデーションは FormRequest に委譲されているか。
        - レスポンスの形式（JSON/Blade/Redirect）が一貫しているか。

    # --- モデル ---
    - path: "app/Models/**"
      instructions: |
        モデルのレビューでは以下を確認してください。
        - `$fillable` または `$guarded` が適切に設定されているか（マスアサインメント対策）。
        - リレーション定義（hasMany, belongsTo など）が正しいか。
        - スコープやアクセサ・ミューテタが適切に使われているか。
        - キャストが設定されているか（日時・JSON カラムなど）。

    # --- マイグレーション ---
    - path: "database/migrations/**"
      instructions: |
        マイグレーションのレビューでは以下を確認してください。
        - `up()` と `down()` の両方が正しく実装されているか（ロールバック可能か）。
        - インデックスが適切に設定されているか（検索・結合に使うカラム）。
        - 外部キー制約が設定されているか。
        - カラムの型・長さが要件に合っているか。
        - NULL 許容の設定が適切か。

    # --- ルート定義 ---
    - path: "routes/**"
      instructions: |
        ルートのレビューでは以下を確認してください。
        - 既存要件で必要なミドルウェアが適用されているか。
        - ルート名が付与されているか（`->name('...')`）。
        - 既存のルーティング方針（個別定義）との整合が取れているか。

    # --- 設定ファイル ---
    - path: "config/**"
      instructions: |
        - 機密情報（API キー・パスワードなど）が直接書かれていないか確認してください。
        - 値は必ず `env('KEY', 'default')` を使って環境変数から取得してください。

    # --- 自動生成ファイル・ロックファイルはレビュー不要 ---
    - path: "public/build/**"
      instructions: "自動生成ファイルのためレビューは不要です。"
    - path: "storage/**"
      instructions: "ストレージディレクトリのためレビューは不要です。"

  # -----------------------------------------------------------------------
  # 【レビュー対象外のパス】
  # 自動生成ファイルやバイナリなど、レビューしても意味のないファイルを除外
  # -----------------------------------------------------------------------
  path_filters:
    - "!composer.lock"           # Composer のロックファイル（自動生成）
    - "!package-lock.json"       # npm のロックファイル（自動生成）
    - "!yarn.lock"               # Yarn のロックファイル（自動生成）
    - "!public/build/**"         # Vite/Mix のビルド成果物（自動生成）
    - "!storage/**"              # ストレージディレクトリ
    - "!bootstrap/cache/**"      # Laravel のキャッシュファイル（自動生成）
    - "!**/*.min.js"             # 圧縮済み JS ファイル
    - "!**/*.min.css"            # 圧縮済み CSS ファイル
    - "!**/_ide_helper*.php"     # IDE ヘルパーファイル（自動生成）

# -----------------------------------------------------------------------
# 【チャット機能の設定】
# PR のコメント欄で @coderabbitai に話しかけると応答してくれる機能
# -----------------------------------------------------------------------
chat:
  # 自動返信を有効にするか
  # true にすると @coderabbitai へのメンションに自動で応答する
  auto_reply: true

# -----------------------------------------------------------------------
# 【ナレッジベースの設定】
# CodeRabbit がリポジトリの知識を蓄積して、レビューの精度を向上させる機能
# -----------------------------------------------------------------------
knowledge_base:

  # ナレッジベースの利用を無効（オプトアウト）にするか
  # false = 有効（推奨）
  opt_out: false

  # Web 検索を使ってレビューの精度を高めるか
  web_search:
    enabled: true

  # 過去のレビューから学習した内容を活用するか
  learnings:
    # auto  : CodeRabbit が自動的にスコープを判断する（推奨）
    # local : このリポジトリ内の学習のみ使用
    # global: 組織全体の学習を使用
    scope: auto
